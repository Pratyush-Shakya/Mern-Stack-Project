<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0EA5E9" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Gallows -->
  <line x1="20" y1="85" x2="60" y2="85" stroke="url(#glow)" stroke-width="6" stroke-linecap="round"/>
  <line x1="35" y1="85" x2="35" y2="20" stroke="url(#glow)" stroke-width="6" stroke-linecap="round"/>
  <line x1="32" y1="20" x2="70" y2="20" stroke="url(#glow)" stroke-width="6" stroke-linecap="round"/>
  <line x1="35" y1="35" x2="50" y2="20" stroke="url(#glow)" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="20" x2="70" y2="35" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Figure -->
  <circle cx="70" cy="43" r="8" stroke="#38BDF8" stroke-width="3" fill="#0F172A" filter="url(#shadow)"/>
  <line x1="70" y1="51" x2="70" y2="65" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="56" x2="63" y2="62" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="56" x2="77" y2="62" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="65" x2="64" y2="76" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="65" x2="76" y2="76" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
</svg>
